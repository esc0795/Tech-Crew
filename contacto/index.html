<!DOCTYPE html><section> <h2>Contacto</h2> <form id="contact-form"> <label>
Nombre
<input type="text" name="nombre" required> </label> <label>
Correo electronico
<input type="email" name="email" required> </label> <label>
Telefono
<input type="tel" name="telefono" required> </label> <label>
Mensaje
<textarea name="mensaje" rows="4" required></textarea> </label> <button type="submit">Enviar</button> </form> <p id="form-status"></p> </section> <script>
  const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzq81F12upMJSBo01TFg5Xoal6vilgKObmDF8fLig_MptDY2qJz1mCmFKRqaikFA8Sruw/exec';

  const form = document.querySelector('#contact-form');
  const statusEl = document.querySelector('#form-status');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    statusEl.textContent = 'Enviando...';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(data)
      });

      if (!res.ok) {
        throw new Error('Error en la respuesta del servidor');
      }

      statusEl.textContent = 'Gracias! Hemos recibido tu mensaje, pronto te contactaremos.';
      form.reset();
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Ocurrió un error al enviar. Intenta de nuevo.';
    }
  });
</script>
